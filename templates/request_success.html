<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Submitted - Tech4Life</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            color: #1f2937;
        }
        
        nav {
            background: #0f766e;
            padding: 16px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        
        .nav-links a:hover {
            text-decoration: underline;
        }
        
        .container {
            width: 90%;
            max-width: 600px;
            margin: 70px auto;
        }
        
        .success-card {
            background: white;
            text-align: center;
            padding: 45px 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #dcfce7;
            color: #166534;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }
        
        h1 {
            color: #0f766e;
            margin-bottom: 12px;
        }
        
        .message {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .status {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 9px 18px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 28px;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        
        .primary {
            background: #0f766e;
            color: white;
        }
        
        .primary:hover {
            background: #115e59;
        }
        
        .secondary {
            background: #e2e8f0;
            color: #334155;
        }
        
        .secondary:hover {
            background: #cbd5e1;
        }
        
        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin: 40px auto;
            }
            .success-card {
                padding: 35px 20px;
            }
            nav {
                padding: 15px 5%;
            }
            .nav-links {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="/" class="logo">Tech4Life</a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/hospitals">Hospitals</a>
            <a href="/blood-bank">Blood Bank</a>
            <a href="/beds">Beds</a>
            <a href="/doctors">Doctors</a>
            <a href="/medicines">Medicines</a>
            <a href="/nearby">Nearby</a>
        </div>
    </nav>

    <div class="container">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <h1>Blood Request Submitted</h1>

            <p class="message">
                Your blood request has been successfully saved in the Tech4Life database.
                <br><br> The request is currently waiting for admin approval.
            </p>

            <div class="status">
                Status: Pending
            </div>

            <div class="buttons">

                <a href="/blood-bank" class="btn primary">
                Back to Blood Bank
            </a>

                <a href="/" class="btn secondary">
                Go to Home
            </a>

            </div>

        </div>

    </div>

</body>

</html>
