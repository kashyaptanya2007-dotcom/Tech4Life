<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Tech4Life</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f766e, #134e4a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }
        
        .logo {
            text-align: center;
            color: #0f766e;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }
        
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }
        
        input:focus {
            border-color: #0f766e;
        }
        
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #0f766e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        
        button:hover {
            background: #115e59;
        }
        
        .demo {
            margin-top: 22px;
            padding: 13px;
            background: #f0fdfa;
            border-left: 4px solid #0f766e;
            color: #475569;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #0f766e;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 500px) {
            .login-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">Tech4Life</div>

        <p class="subtitle">
            Admin Dashboard Login
        </p>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/admin/login">

            <div class="form-group">
                <label for="username">Username</label>

                <input type="text" id="username" name="username" placeholder="Enter username" value="{{ request.form.get('username', '') }}" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit">
            Login to Admin Panel
        </button>

        </form>

        <div class="demo">
            <strong>Demo Login</strong><br> Username: admin<br> Password: admin123
        </div>

        <a href="/" class="back">
        ← Back to Home
    </a>

    </div>

</body>

</html>
