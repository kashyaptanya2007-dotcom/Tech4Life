<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if medicine %} Edit Medicine {% else %} Add Medicine {% endif %} - Tech4Life
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #f4f7fb;
            min-height: 100vh;
        }
        
        .container {
            width: 90%;
            max-width: 650px;
            margin: 60px auto;
        }
        
        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        h1 {
            color: #0d47a1;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        
        input:focus,
        select:focus {
            border-color: #0d47a1;
        }
        
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        
        button,
        .cancel {
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }
        
        button {
            background: #0d47a1;
            color: white;
        }
        
        button:hover {
            background: #083b88;
        }
        
        .cancel {
            background: #e0e0e0;
            color: #333;
        }
        
        .cancel:hover {
            background: #d0d0d0;
        }
        
        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin: 30px auto;
            }
            .card {
                padding: 25px;
            }
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            {% if medicine %}
            <h1>Edit Medicine</h1>
            <p class="subtitle">
                Update medicine information.
            </p>
            {% else %}
            <h1>Add Medicine</h1>
            <p class="subtitle">
                Add a new medicine to Tech4Life.
            </p>
            {% endif %}


            <form method="POST" action="{% if medicine %}/admin/medicine/edit/{{ medicine['id'] }}{% else %}/admin/medicine/add{% endif %}">

                <div class="form-group">

                    <label for="name">
                    Medicine Name
                </label>

                    <input type="text" id="name" name="name" placeholder="Enter medicine name" value="{{ medicine['name'] if medicine else '' }}" required>

                </div>


                <div class="form-group">

                    <label for="category">
                    Category
                </label>

                    <input type="text" id="category" name="category" placeholder="Example: Antibiotic" value="{{ medicine['category'] if medicine else '' }}" required>

                </div>


                <div class="form-group">

                    <label for="availability">
                    Availability
                </label>

                    <select id="availability" name="availability">

                    <option
                        value="Available"
                        {% if medicine and medicine['availability'] == 'Available' %}
                            selected
                        {% endif %}>
                        Available
                    </option>

                    <option
                        value="Limited"
                        {% if medicine and medicine['availability'] == 'Limited' %}
                            selected
                        {% endif %}>
                        Limited
                    </option>

                    <option
                        value="Out of Stock"
                        {% if medicine and medicine['availability'] == 'Out of Stock' %}
                            selected
                        {% endif %}>
                        Out of Stock
                    </option>

                </select>

                </div>


                <div class="buttons">

                    <button type="submit">
                    {% if medicine %}
                        Update Medicine
                    {% else %}
                        Add Medicine
                    {% endif %}
                </button>

                    <a href="/admin" class="cancel">
                    Cancel
                </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
