<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if mode == "add" %} Add Blood Stock {% else %} Edit Blood Stock {% endif %} - Tech4Life
    </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #f4f8fb;
            min-height: 100vh;
        }
        
        .navbar {
            background: #073b4c;
            color: white;
            padding: 18px 40px;
            font-size: 25px;
            font-weight: bold;
        }
        
        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }
        
        .form-box {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
        
        h1 {
            color: #073b4c;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }
        
        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        
        input:focus,
        select:focus {
            border-color: #0f9d9a;
        }
        
        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        
        button,
        .cancel {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }
        
        button {
            background: #0f9d9a;
            color: white;
        }
        
        button:hover {
            background: #087f7c;
        }
        
        .cancel {
            background: #e2e8f0;
            color: #334155;
        }
        
        .cancel:hover {
            background: #cbd5e1;
        }
        
        @media (max-width: 600px) {
            .navbar {
                padding: 15px 20px;
            }
            .container {
                width: 95%;
                margin: 25px auto;
            }
            .form-box {
                padding: 25px;
            }
            .buttons {
                flex-direction: column;
            }
        }
    </style>

</head>

<body>

    <div class="navbar">
        🏥 Tech4Life
    </div>


    <div class="container">

        <div class="form-box">

            {% if mode == "add" %}

            <h1>➕ Add Blood Stock</h1>

            <p class="subtitle">
                Add a blood group and its available units.
            </p>

            {% else %}

            <h1>✏️ Edit Blood Stock</h1>

            <p class="subtitle">
                Update blood group availability.
            </p>

            {% endif %} {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST">

                <div class="form-group">

                    <label>
                        Blood Group
                    </label>

                    <select name="blood_group" required>

                        <option value="">
                            Select Blood Group
                        </option>

                        {% for group in ["A+", "A-", "B+", "B-", "O+", "O-", "AB+", "AB-"] %}

                        <option
                            value="{{ group }}"
                            {% if blood and blood["blood_group"] == group %}
                            selected
                            {% endif %}
                        >
                            {{ group }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Available Units
                    </label>

                    <input type="number" name="units" min="0" value="{{ blood['units'] if blood else '' }}" placeholder="Enter available units" required>

                </div>


                <div class="buttons">

                    <button type="submit">

                        {% if mode == "add" %}
                        Add Blood Stock
                        {% else %}
                        Update Blood Stock
                        {% endif %}

                    </button>

                    <a href="/admin" class="cancel">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
