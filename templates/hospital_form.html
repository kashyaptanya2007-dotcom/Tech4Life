<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if hospital %} Edit Hospital - Tech4Life {% else %} Add Hospital - Tech4Life {% endif %}
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #f4f8fb;
            min-height: 100vh;
        }
        
        .navbar {
            background: #0b5ed7;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 25px;
            font-weight: bold;
        }
        
        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }
        
        .container {
            width: 90%;
            max-width: 700px;
            margin: 45px auto;
        }
        
        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
        
        h1 {
            color: #123;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        
        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }
        
        input:focus,
        select:focus {
            outline: none;
            border-color: #0b5ed7;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .btn {
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }
        
        .save {
            background: #0b5ed7;
            color: white;
            flex: 1;
        }
        
        .cancel {
            background: #e9ecef;
            color: #333;
            flex: 1;
        }
        
        .save:hover {
            background: #084db2;
        }
        
        .cancel:hover {
            background: #d6d9dc;
        }
        
        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">Tech4Life</div>

        <a href="/admin" class="back-btn">
        ← Back to Admin
    </a>
    </div>

    <div class="container">

        <div class="card">

            {% if hospital %}
            <h1>Edit Hospital</h1>
            <p class="subtitle">
                Update hospital information and bed availability.
            </p>
            {% else %}
            <h1>Add Hospital</h1>
            <p class="subtitle">
                Add a new hospital to the Tech4Life system.
            </p>
            {% endif %}

            <form method="POST">

                <div class="form-group">
                    <label>Hospital Name</label>

                    <input type="text" name="name" required value="{{ hospital['name'] if hospital else '' }}" placeholder="Enter hospital name">
                </div>

                <div class="form-group">
                    <label>Location</label>

                    <input type="text" name="location" required value="{{ hospital['location'] if hospital else '' }}" placeholder="Example: Prem Nagar, Dehradun">
                </div>

                <div class="row">

                    <div class="form-group">
                        <label>Total Beds</label>

                        <input type="number" name="total_beds" min="0" required value="{{ hospital['total_beds'] if hospital else '' }}" placeholder="Total beds">
                    </div>

                    <div class="form-group">
                        <label>Available Beds</label>

                        <input type="number" name="available_beds" min="0" required value="{{ hospital['available_beds'] if hospital else '' }}" placeholder="Available beds">
                    </div>

                </div>

                <div class="row">

                    <div class="form-group">
                        <label>Number of Doctors</label>

                        <input type="number" name="doctors" min="0" required value="{{ hospital['doctors'] if hospital else '' }}" placeholder="Number of doctors">
                    </div>

                    <div class="form-group">
                        <label>Medicine Availability</label>

                        <select name="medicines">

                        <option value="Available"
                            {% if hospital and hospital['medicines'] == 'Available' %}
                                selected
                            {% endif %}>
                            Available
                        </option>

                        <option value="Limited"
                            {% if hospital and hospital['medicines'] == 'Limited' %}
                                selected
                            {% endif %}>
                            Limited
                        </option>

                        <option value="Unavailable"
                            {% if hospital and hospital['medicines'] == 'Unavailable' %}
                                selected
                            {% endif %}>
                            Unavailable
                        </option>

                    </select>
                    </div>

                </div>

                <div class="form-group">
                    <label>Phone Number</label>

                    <input type="text" name="phone" required value="{{ hospital['phone'] if hospital else '' }}" placeholder="+91 XXXXX XXXXX">
                </div>

                <div class="buttons">

                    <a href="/admin" class="btn cancel">
                    Cancel
                </a>

                    <button type="submit" class="btn save">
                    {% if hospital %}
                        Update Hospital
                    {% else %}
                        Add Hospital
                    {% endif %}
                </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
